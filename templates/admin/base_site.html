{% extends "admin/base.html" %}
{% load i18n %}

{% block branding %}
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
  <h1 id="site-name"><a href="{% url 'admin:index' %}">{% trans "Folhas de horas" %}</a></h1>
  <form method="post" action="{% url 'set_language' %}" class="language-form" aria-label="{% trans 'Idioma' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if LANGUAGE_CODE == "en" %}
    <button class="language-flag" type="submit" name="language" value="pt-pt"
            aria-label="{% trans 'Mudar idioma para Português (Portugal)' %}" title="{% trans 'Mudar idioma para Português (Portugal)' %}">
      <span>PT</span><span aria-hidden="true">🇵🇹</span>
    </button>
    {% else %}
    <button class="language-flag" type="submit" name="language" value="en"
            aria-label="{% trans 'Mudar idioma para inglês' %}" title="{% trans 'Mudar idioma para inglês' %}">
      <span>GB</span><span aria-hidden="true">🇬🇧</span>
    </button>
    {% endif %}
  </form>
</div>
{% endblock %}
